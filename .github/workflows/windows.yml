name: Installateurs de test (Windows et Mac)

# Fabrique les installateurs Windows et Mac à télécharger depuis la page de l'exécution,
# sans publier de version. Pour publier : « Publier une version ».
on:
  workflow_dispatch:
  # Vérifie aussi que chaque pull request compile sous Windows.
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'installateur
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Onde-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'application Mac (Intel + Apple Silicon)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Onde-Mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
